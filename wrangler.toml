name = "live-on-campus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "worker.js"

# Run vite build before wrangler deploys, producing the dist/ directory.
[build]
command = "npm install && npm run build"

# Static assets served via the ASSETS binding in worker.js.
# not_found_handling = "single-page-application" falls back to index.html
# for all unmatched routes, required for client-side TanStack Router.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
