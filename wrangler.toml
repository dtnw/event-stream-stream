name = "live-on-campus"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve the Vite-built SPA as Workers static assets.
# The Workers runtime serves index.html for all unmatched routes,
# which is the correct behaviour for a client-side TanStack Router SPA.
[assets]
directory = "./dist"
html_handling = "single-page-application"
not_found_handling = "single-page-application"
