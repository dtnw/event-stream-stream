name = "live-on-campus"
compatibility_date = "2024-09-23"

# Run vite build before wrangler deploys, producing the dist/ directory.
[build]
command = "npm run build"

# Serve the Vite-built SPA as Workers static assets.
# not_found_handling = "single-page-application" ensures all unmatched routes
# fall back to index.html, which is required for client-side TanStack Router.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
